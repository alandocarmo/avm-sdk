[descriptor]
execution_mode = "message_isolated"
state_schema_id = "e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7"
# The owner key, kept at data[4..36], signs probe.spawn.
owner_key_offset = 4

[bindings]
enabled = true

# Explicit resources: the repro only needs a deployment build, not a measurement.
[build]
stack_bytes = 16384
arena_bytes = 65536
max_memory_bytes = 262144

[abi]
state_root_type_id = 1
init_input_type_id = 2

[[abi.types]]
id = 1
kind = "fixed_bytes"
name = "probe_state"
len = 185

# Constructor data: 00 accepts, 01 refuses.
[[abi.types]]
id = 2
kind = "fixed_bytes"
name = "probe_init"
len = 1

# probe.spawn: mode | salt byte.
[[abi.types]]
id = 3
kind = "fixed_bytes"
name = "probe_spawn"
len = 2

[[abi.methods]]
name = "probe.spawn"
input_type_id = 3

[[abi.methods]]
name = "probe.result"

[[abi.errors]]
status_code = 1400
name = "refused"
message = "constructor data 01: the init refuses"

[[abi.errors]]
status_code = 1401
name = "invalid_call"
message = "the probe takes probe.spawn from its owner key and the callback of its own deploy"
